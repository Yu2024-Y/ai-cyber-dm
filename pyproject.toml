# 项目构建 / 测试 / lint 统一配置
[project]
name = "ai-cyber-dm"
version = "0.1.0"
description = "AI 赛博 DM 与无限跑团引擎"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
