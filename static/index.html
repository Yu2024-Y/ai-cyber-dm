<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070d">
  <title>AI 赛博 DM</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #05070d;
      --panel: #0b1120;
      --panel2: #0f1728;
      --line: #1d2a44;
      --line-hi: #2c4370;
      --txt: #dbe6ff;
      --mut: #7e90b5;
      --dim: #4a5a7c;
      --cyan: #46e7ff;
      --mag: #ff3ea5;
      --amb: #ffc857;
      --grn: #43e58a;
      --mono: "Cascadia Code", Consolas, "Courier New", monospace;
      --cjk: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--cjk);
      background: var(--bg); color: var(--txt);
      overflow: hidden;
    }
    /* ── 氛围层：霓虹光晕 + 扫描线 ── */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(1000px 520px at 12% -12%, rgba(70, 231, 255, .13), transparent 62%),
        radial-gradient(860px 520px at 108% 8%, rgba(255, 62, 165, .11), transparent 60%),
        radial-gradient(760px 640px at 50% 118%, rgba(96, 140, 255, .12), transparent 62%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
      background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(140, 175, 255, .022) 2px 4px);
      mix-blend-mode: screen;
    }
    .view {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column;
    }
    .view[hidden] { display: none; }
    button { cursor: pointer; font-family: inherit; }

    ::selection { background: rgba(70, 231, 255, .28); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 8px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ── 通用件 ── */
    .kicker {
      font: 600 10px/1 var(--mono); letter-spacing: .28em; text-transform: uppercase;
      color: var(--dim); display: inline-flex; align-items: center; gap: 8px;
    }
    .kicker .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan); animation: blink 2.2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .sec-title {
      font: 700 12px/1 var(--mono); letter-spacing: .18em; color: var(--mut);
      margin: 26px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .sec-title::after { content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--line-hi), transparent); }
    .btn {
      border-radius: 10px; transition: transform .14s ease, box-shadow .2s ease,
        background .2s ease, border-color .2s ease, color .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .ghost {
      border: 1px solid var(--line-hi); background: linear-gradient(180deg, #101a30, #0a1120);
      color: var(--txt);
    }
    .ghost:hover { border-color: var(--cyan); color: var(--cyan);
      box-shadow: 0 0 0 1px rgba(70, 231, 255, .35), 0 6px 20px -8px rgba(70, 231, 255, .5); }
    .glow-btn {
      border: 1px solid rgba(70, 231, 255, .5); color: #04131a;
      background: linear-gradient(180deg, #8ff2ff, var(--cyan));
      box-shadow: 0 0 18px -4px rgba(70, 231, 255, .75);
      font-weight: 700;
    }
    .glow-btn:hover { box-shadow: 0 0 26px -2px rgba(70, 231, 255, .95); }
    .empty { color: var(--dim); text-align: center; padding: 34px 0; font-size: 13px;
      border: 1px dashed var(--line); border-radius: 12px; }

    /* ── 大厅 ── */
    .lobby { width: min(760px, 100%); margin: 0 auto; padding: 40px 22px; overflow-y: auto; }
    .brand-block { text-align: center; padding: 8px 0 6px; }
    .brand {
      font-size: clamp(34px, 6vw, 52px); font-weight: 900; letter-spacing: 1px; line-height: 1.1;
      background: linear-gradient(100deg, #dff6ff 10%, var(--cyan) 42%, var(--mag) 88%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 18px rgba(70, 231, 255, .22));
    }
    .brand em { font-style: italic; }
    .tag { color: var(--mut); font-size: 13px; margin-top: 10px; text-align: center;
      font-family: var(--mono); letter-spacing: .06em; }
    .new-game {
      margin-top: 26px; display: flex; gap: 10px;
      background: linear-gradient(180deg, rgba(15,23,40,.7), rgba(9,14,26,.7));
      border: 1px solid var(--line); border-radius: 14px; padding: 12px;
      backdrop-filter: blur(4px);
    }
    #new-name {
      flex: 1; padding: 12px 14px; border-radius: 10px; font-size: 15px;
      border: 1px solid var(--line); background: rgba(5, 8, 15, .85); color: var(--txt);
      transition: border-color .2s, box-shadow .2s;
    }
    #new-name:focus { outline: none; border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(70, 231, 255, .16); }
    #new-name::placeholder { color: var(--dim); }
    #btn-new { padding: 12px 22px; border: none; border-radius: 10px; white-space: nowrap; }
    #btn-new:disabled { opacity: .5; cursor: not-allowed; }
    .lobby-list { display: flex; flex-direction: column; gap: 10px; }
    .game-card {
      display: flex; align-items: center; gap: 16px; padding: 14px 16px;
      background: linear-gradient(180deg, rgba(15,23,40,.78), rgba(9,14,26,.8));
      border: 1px solid var(--line); border-radius: 13px; position: relative; overflow: hidden;
      transition: border-color .18s, transform .18s;
    }
    .game-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--cyan), var(--mag)); opacity: .8; }
    .game-card:hover { border-color: var(--line-hi); transform: translateY(-1px); }
    .game-card .gn { font-size: 16px; color: var(--txt); font-weight: 700; }
    .game-card .meta { font: 500 12px/1 var(--mono); color: var(--mut); margin-top: 6px; }
    .game-card .gbtn { margin-left: auto; padding: 8px 18px; }

    /* ── 选角色 ── */
    .roles { width: min(980px, 100%); margin: 0 auto; padding: 26px 22px; overflow-y: auto; }
    .topline { display: flex; align-items: center; gap: 16px; }
    .topline h2 { font-size: 20px; font-weight: 800; color: var(--txt); }
    .topline h2 span { color: var(--cyan); }
    #btn-back { padding: 8px 14px; font-size: 13px; }
    .hint { color: var(--mut); margin: 16px 0 14px; font-size: 12.5px;
      font-family: var(--mono); letter-spacing: .04em; }
    .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 13px; }
    .role-card {
      background: linear-gradient(180deg, var(--panel2), #090f1c);
      border: 1px solid var(--line); border-radius: 14px; padding: 15px; text-align: left;
      color: var(--txt); position: relative; overflow: hidden;
      box-shadow: 0 10px 24px -18px rgba(0,0,0,.8);
      transition: border-color .16s, transform .16s, box-shadow .22s;
    }
    .role-card::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(240px 120px at 50% 0%, color-mix(in srgb, var(--role, var(--cyan)) 22%, transparent), transparent 70%);
      transition: opacity .25s;
    }
    .role-card:hover:not(.taken) { border-color: color-mix(in srgb, var(--role, var(--cyan)) 70%, transparent);
      transform: translateY(-3px); }
    .role-card:hover:not(.taken)::after { opacity: 1; }
    .role-card.taken { opacity: .42; cursor: not-allowed; filter: saturate(.4); }
    .rc-top { display: flex; align-items: center; gap: 9px; }
    .rc-top .emoji { font-size: 24px; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--role, var(--cyan)) 55%, transparent)); }
    .rc-top .nm { font-size: 16px; font-weight: 800; }
    .rc-top .cs { color: var(--dim); font: 600 11px/1 var(--mono); margin-left: auto; letter-spacing: .12em; }
    .rc-title { font-size: 12px; color: var(--mut); margin: 7px 0 9px; }
    .rc-skills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
    .rc-skill {
      font: 500 11px/1 var(--mono); color: var(--txt); background: rgba(255,255,255,.04);
      border: 1px solid var(--line); border-radius: 12px; padding: 3px 9px;
    }
    .rc-desc { font-size: 12px; color: var(--mut); line-height: 1.65; }
    .rc-foot { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--grn);
      font-family: var(--mono); letter-spacing: .02em; }
    .rc-taken { color: var(--mag); }

    /* ── 游戏主界面 ── */
    .game-head {
      display: flex; align-items: center; gap: 16px; padding: 12px 18px;
      background: linear-gradient(180deg, rgba(11,17,32,.95), rgba(7,11,20,.9));
      border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
    }
    .game-head h1 { font-size: 17px; font-weight: 800; color: var(--txt);
      text-shadow: 0 0 14px rgba(70,231,255,.3); white-space: nowrap; }
    .gt .kicker { color: var(--dim); margin-bottom: 5px; }
    .backbtn { padding: 8px 14px; border-radius: 9px; font-size: 13px; }
    .roster { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font: 600 12px/1 var(--mono); color: var(--txt); padding: 4px 10px; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(255,255,255,.035);
      display: inline-flex; align-items: center; gap: 6px; letter-spacing: .02em;
    }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .chip.me { border-color: rgba(70,231,255,.55); color: var(--cyan); }
    #me-chip { margin-left: auto; }
    #layout { flex: 1; display: flex; min-height: 0; }
    #chat {
      flex: 1; overflow-y: auto; padding: 22px 20px 30px;
      display: flex; flex-direction: column; gap: 14px; min-width: 0;
      scroll-behavior: smooth;
    }
    .msg { max-width: 80%; position: relative; animation: msgIn .3s ease both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg .who {
      font: 700 11px/1 var(--mono); letter-spacing: .06em; margin-bottom: 6px;
      color: color-mix(in srgb, var(--who, var(--cyan)) 80%, #fff); text-shadow: 0 0 8px color-mix(in srgb, var(--who, var(--cyan)) 45%, transparent);
    }
    .msg .dbody { line-height: 1.75; word-break: break-word; white-space: pre-wrap; font-size: 14.5px; }
    .msg.user {
      align-self: flex-end; border-radius: 16px 6px 16px 16px; padding: 11px 15px;
      background: #1e9cff; /* 老浏览器兜底 */
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--who, #1e9cff) 88%, #fff 8%),
        color-mix(in srgb, var(--who, #1e9cff) 45%, #0b1220 55%));
      color: #fff; border: 1px solid color-mix(in srgb, var(--who, #1e9cff) 55%, transparent);
      box-shadow: 0 6px 22px -12px color-mix(in srgb, var(--who, #1e9cff) 70%, transparent);
    }
    .msg.dm {
      align-self: flex-start; max-width: 82%;
      background: linear-gradient(180deg, rgba(18,25,44,.9), rgba(10,16,30,.92));
      border: 1px solid var(--line); border-left: 2px solid var(--cyan);
      border-radius: 6px 16px 16px 16px; padding: 12px 16px;
      box-shadow: 0 10px 30px -20px rgba(70,231,255,.5);
      font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
    }
    .msg.dm::before {
      content: "DM · 叙事流 ▸"; display: block;
      font: 700 10px/1 var(--mono); letter-spacing: .22em; color: var(--cyan);
      opacity: .75; margin-bottom: 7px;
    }
    .msg .hl {
      color: #9ff3ff; font-weight: 800;
      text-shadow: 0 0 12px rgba(70, 231, 255, .65);
      background: linear-gradient(180deg, transparent 58%, rgba(70, 231, 255, .12) 58%);
      border-radius: 2px;
    }
    .msg.sys { align-self: center; max-width: 92%; color: var(--dim); font-size: 12.5px;
      text-align: center; font-family: var(--mono); line-height: 1.7; }
    .msg.error { align-self: flex-start; background: rgba(255,62,165,.1); color: #ff8dc0;
      border: 1px solid rgba(255,62,165,.4); border-radius: 12px; padding: 10px 14px; font-size: 13px; }

    /* 面板 */
    #panel {
      width: 330px; min-width: 330px; border-left: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(8,12,22,.9), rgba(6,9,16,.94));
      display: flex; flex-direction: column; overflow-y: auto; padding: 16px; gap: 20px;
    }
    #panel h2 {
      font: 800 11px/1 var(--mono); letter-spacing: .2em; color: var(--mut);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase;
    }
    #panel h2::after { content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--line-hi), transparent); }
    #scene-card {
      background: linear-gradient(180deg, #0d1424, #080d18);
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
      min-height: 108px; display: flex; flex-direction: column; position: relative;
    }
    #scene-card .sc-body {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
      color: var(--mut); font-size: 13px; padding: 16px; text-align: center; min-height: 150px;
      background:
        radial-gradient(220px 120px at 50% 0%, rgba(70,231,255,.08), transparent 70%);
    }
    #scene-card img { width: 100%; display: block; animation: msgIn .4s ease; }
    #scene-card .sc-foot {
      padding: 8px 12px; font: 600 11px/1 var(--mono); color: var(--mut);
      border-top: 1px solid var(--line); background: rgba(4,7,13,.6);
      display: flex; justify-content: space-between; align-items: center; letter-spacing: .05em;
    }
    #scene-status .ok { color: var(--grn); }
    #scene-regen { padding: 4px 10px; font-size: 11px; }
    .spinner { width: 18px; height: 18px; border-radius: 50%; flex: none;
      border: 2px solid var(--line-hi); border-top-color: var(--cyan);
      animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 场景卡加载态：骨架流光 */
    .skeleton {
      width: 100%; height: 150px; border-radius: 6px;
      background: linear-gradient(90deg, #101a30 25%, #182742 37%, #101a30 63%);
      background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

    #story-box { flex: 1; overflow-y: auto; }
    #story-tree ul { list-style: none; margin-left: 13px; padding-left: 13px;
      border-left: 1px solid var(--line); }
    #story-tree > ul { margin-left: 0; padding-left: 0; border-left: none; }
    #story-tree li { padding: 4px 0; font-size: 12px; line-height: 1.55; position: relative; }
    #story-tree li::before {
      content: ""; position: absolute; left: -13px; top: 12px; width: 11px; height: 1px;
      background: var(--line-hi);
    }
    #story-tree > ul > li::before { display: none; }
    #story-tree .tlabel { word-break: break-word; }
    #story-tree .tn-scene { color: var(--cyan); font-weight: 800; font-size: 13px;
      text-shadow: 0 0 12px rgba(70,231,255,.5); }
    #story-tree .tn-scene::marker, #story-tree .tn-scene .tlabel::before { content: "◎ "; }
    #story-tree .tn-story { color: var(--txt); }
    #story-tree .tn-action { color: var(--grn); }

    /* 输入条 + 骰子 */
    .game-foot {
      display: flex; gap: 10px; padding: 12px 16px; position: relative;
      background: linear-gradient(180deg, rgba(11,17,32,.95), rgba(7,11,20,.95));
      border-top: 1px solid var(--line);
    }
    #dice-btn { padding: 10px 15px; border-radius: 10px; font-size: 17px; }
    .dice-menu {
      position: absolute; bottom: 64px; left: 16px; width: 258px; z-index: 60;
      background: linear-gradient(180deg, #101a30, #0a1120); border: 1px solid var(--line-hi);
      border-radius: 13px; padding: 13px;
      box-shadow: 0 18px 44px -18px rgba(0,0,0,.8), 0 0 0 1px rgba(255,200,87,.06);
      animation: msgIn .16s ease;
    }
    .dice-menu .d-title {
      font: 700 11px/1 var(--mono); letter-spacing: .12em; color: var(--amb);
      margin-bottom: 10px;
    }
    .dice-presets { display: flex; flex-direction: column; gap: 7px; }
    .dice-presets button {
      text-align: left; padding: 9px 11px; border-radius: 9px; font-size: 13px;
      border: 1px solid var(--line); background: rgba(5,8,15,.7); color: var(--txt);
      transition: border-color .15s, color .15s, transform .12s;
    }
    .dice-presets button:hover { border-color: var(--amb); color: var(--amb);
      transform: translateX(2px); }
    #input {
      flex: 1; padding: 11px 15px; border-radius: 11px; font-size: 15px;
      border: 1px solid var(--line); background: rgba(5,8,15,.85); color: var(--txt);
      transition: border-color .2s, box-shadow .2s;
    }
    #input:focus { outline: none; border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(70,231,255,.15); }
    #input::placeholder { color: var(--dim); }
    #send { padding: 11px 22px; border-radius: 11px; }
    #send:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

    #toast {
      position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 99;
      background: linear-gradient(180deg, #101a30, #0a1120);
      border: 1px solid var(--cyan); color: var(--txt); font-size: 13px; padding: 10px 18px;
      border-radius: 24px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
      box-shadow: 0 0 24px -6px rgba(70,231,255,.6); max-width: 84%;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    @media (max-width: 900px) {
      #panel { width: 250px; min-width: 250px; }
    }
    @media (max-width: 720px) {
      #panel { display: none; }
      .game-head { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <!-- 大厅 -->
  <section id="view-lobby" class="view">
    <div class="lobby">
      <div class="brand-block">
        <div class="kicker" style="justify-content:center"><span class="dot"></span> CYBER DM // 系统在线</div>
        <h1 class="brand">AI 赛博 <em>DM</em></h1>
        <p class="tag">多人跑团 · LLM 主持 · 场景卡 · 语音 · 剧情树 · 骰子检定</p>
      </div>
      <div class="new-game">
        <input id="new-name" placeholder="给新战役起个名字，例如：夜雾试炼" autocomplete="off">
        <button id="btn-new" class="btn glow-btn">开始新战役</button>
      </div>
      <h2 class="sec-title">▍ 战役存档 · ARCHIVE</h2>
      <div id="lobby-list" class="lobby-list"></div>
    </div>
  </section>

  <!-- 选角色 -->
  <section id="view-roles" class="view" hidden>
    <div class="roles">
      <div class="topline">
        <button id="btn-back" class="btn ghost backbtn">‹ 返回大厅</button>
        <h2>接入战役 <span id="role-game-name"></span></h2>
      </div>
      <p class="hint">选择一个角色接入 · 同一角色只能被一位玩家占用</p>
      <div id="role-cards" class="role-grid"></div>
    </div>
  </section>

  <!-- 游戏内 -->
  <section id="view-game" class="view" hidden>
    <header class="game-head">
      <button id="btn-home" class="btn ghost backbtn">‹ 大厅</button>
      <div class="gt">
        <div class="kicker">CAMPAIGN // 战役频道</div>
        <h1 id="game-title"></h1>
      </div>
      <span id="turn-badge" class="chip"></span>
      <div id="roster" class="roster"></div>
      <button id="end-btn" class="btn ghost backbtn">结束本局</button>
      <div id="me-chip" class="chip me"></div>
    </header>
    <div id="layout">
      <main id="chat"></main>
      <aside id="panel">
        <section>
          <h2>场景卡</h2>
          <div id="scene-card">
            <div class="sc-body" id="scene-body">对话推进后自动绘制当前场景…</div>
            <div class="sc-foot">
              <span id="scene-status">未生成</span>
              <button id="scene-regen" class="btn ghost">再画一张</button>
            </div>
          </div>
        </section>
        <section id="story-box">
          <h2>剧情树</h2>
          <div id="story-tree"></div>
        </section>
      </aside>
    </div>
    <footer class="game-foot">
      <button id="dice-btn" class="btn ghost" title="掷骰检定">🎲</button>
      <div id="dice-menu" class="dice-menu" hidden>
        <div class="d-title">掷骰检定 · 1d20 ≥ 难度即成功</div>
        <div class="dice-presets">
          <button data-formula="1d20" data-dc="8">🟢 简单 · DC 8</button>
          <button data-formula="1d20" data-dc="12">🟡 标准 · DC 12</button>
          <button data-formula="1d20" data-dc="16">🔴 困难 · DC 16</button>
          <button data-formula="2d6" data-dc="7">🍀 幸运 · 2d6 ≥ 7</button>
        </div>
      </div>
